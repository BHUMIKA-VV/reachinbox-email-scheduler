version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reachinbox
      POSTGRES_USER: reach
      POSTGRES_PASSWORD: reachpw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:

